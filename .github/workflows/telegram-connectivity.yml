
name: Telegram channel access test

on:
  workflow_dispatch:

jobs:
  test-channel:
    runs-on: ubuntu-latest
    steps:
      - name: Check bot and channel access
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -e

          RESPONSE=$(curl --silent --show-error --fail \
            --get \
            --data-urlencode "chat_id=@khabaronlineirn" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChat")

          echo "$RESPONSE"
